name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press the hotkey
        2. ...
  - type: input
    id: version
    attributes:
      label: Kesit version
      description: Output of `kesit --version`, or the release you installed.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example "macOS 15.2, Apple Silicon" or "Ubuntu 24.04, GNOME on Wayland".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Run `kesit` (or `kesit capture`) from a terminal and paste any `kesit:` lines.
      render: text
